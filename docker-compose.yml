version: '3.8'

services:
  app:
    build: .
    container_name: plan-takeoff-app
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # A second, separate volume for BACKUP_PATH below — swap the host path
      # for wherever this deployment's other disk is mounted.
      # - /mnt/user/frugal-backups:/backups
    environment:
      - NODE_ENV=production
      - STORAGE_PATH=/app/data
      # ── Mail client (docs/mail-setup.md) ─────────────────────────────────
      # All optional. Without them mail still works as IMAP-only, poll-only.
      # The public HTTPS origin. OAuth redirect URIs and the Microsoft Graph
      # webhook URL are built from it; unset, Connect returns 503 and Microsoft
      # accounts poll instead of receiving push.
      # - APP_PUBLIC_URL=https://takeoff.example.com
      # 32 bytes as hex (64 chars) or base64, sealing stored mail credentials.
      # Unset, the server generates /app/data/mail.key (0600) on first start —
      # back that file up with the data directory.
      # - MAIL_SECRET_KEY=
      # - GOOGLE_OAUTH_CLIENT_ID=
      # - GOOGLE_OAUTH_CLIENT_SECRET=
      # - MS_OAUTH_CLIENT_ID=
      # - MS_OAUTH_CLIENT_SECRET=
      # Directory (tenant) ID for a single-tenant registration; default common.
      # - MS_OAUTH_TENANT=common
      # ── Backups (Settings → Backup) ───────────────────────────────────────
      # Point this at a second volume so a backup isn't on the same disk as
      # the data it protects. Unset, backups still work but write under
      # /app/data (the Backup tab flags this in amber).
      # - BACKUP_PATH=/backups
    restart: unless-stopped
