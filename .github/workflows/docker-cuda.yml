name: Docker CUDA Image CI

# Builds the GPU image (Dockerfile.cuda) and publishes ghcr.io/<repo>:cuda
# (plus a :cuda-<sha> for traceability). It tracks the `testing` branch: every
# push to testing rebuilds :cuda, mirroring how the CPU :testing tag works, so
# the GPU image stays in sync with your live box. You can also build on demand:
#   * Actions tab -> "Docker CUDA Image CI" -> Run workflow (any branch), OR
#   * push a git tag matching `cuda-*` (e.g. `git tag cuda-1 && git push origin cuda-1`).
# GPU builds are large/slow; GHA layer caching keeps incremental builds faster.
# Point your Unraid container's Repository at the :cuda tag and re-pull to update.

on:
  workflow_dispatch:
  push:
    branches: [ "testing" ]
    tags: [ 'cuda-*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-cuda-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        # CUDA base images are large; reclaim space so the build doesn't run out.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cuda
            type=sha,prefix=cuda-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
